<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="SmartPark Maroc - Moroccan license plate detection and OCR">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#0f1f2e"/>
      <stop offset="100%" stop-color="#12303f"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>

  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <path d="M0 90 H1280 M0 180 H1280 M0 270 H1280 M0 360 H1280"/>
    <path d="M160 0 V420 M320 0 V420 M480 0 V420 M640 0 V420 M800 0 V420 M960 0 V420 M1120 0 V420"/>
  </g>

  <circle cx="1120" cy="70" r="150" fill="#22c55e" opacity="0.08"/>
  <circle cx="1210" cy="360" r="190" fill="#38bdf8" opacity="0.07"/>

  <text x="80" y="148" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="64" font-weight="700" fill="#f8fafc">SmartPark Maroc</text>
  <text x="82" y="202" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="28" fill="#94a3b8">Moroccan license plate detection and OCR</text>

  <rect x="80" y="240" width="300" height="46" rx="23" fill="#f59e0b"/>
  <text x="230" y="270" text-anchor="middle" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">WORK IN PROGRESS</text>

  <text x="82" y="338" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="20" fill="#64748b">YOLO11n  |  PyTorch CPU  |  Streamlit</text>

  <g transform="translate(820 110)" filter="url(#shadow)">
    <rect x="0" y="0" width="360" height="150" rx="18" fill="url(#plate)" stroke="#cbd5e1" stroke-width="4"/>
    <rect x="0" y="0" width="44" height="150" rx="18" fill="#0f766e"/>
    <text x="22" y="88" text-anchor="middle" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#f8fafc" transform="rotate(-90 22 88)">MAROC</text>
    <text x="202" y="96" text-anchor="middle" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="2" fill="#0f172a">12345-A-6</text>
  </g>

  <rect x="798" y="88" width="404" height="194" rx="6" fill="none" stroke="#22c55e" stroke-width="5"/>
  <rect x="798" y="56" width="224" height="32" rx="6" fill="#22c55e"/>
  <text x="812" y="78" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#052e16">license_plate 0.94</text>
</svg>
