  <text x="282" y="58" font-size="28" font-weight="bold" fill="#0f172a">SmartPark Maroc</text>
  <text x="282" y="82" font-size="12" fill="#64748b">AI-powered Moroccan parking management - licence-plate detection demo. CPU-only.</text>

  <rect x="282" y="104" width="690" height="72" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
