  <text x="496" y="603" font-size="11" fill="#94a3b8">No recogniser is bundled yet (expected warning).</text>

  <text x="282" y="628" font-size="10" fill="#94a3b8">UI illustration based on app/app.py - widgets, layout and messages match the demo.</text>
